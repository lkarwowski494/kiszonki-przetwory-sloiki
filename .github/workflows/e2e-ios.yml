name: E2E iOS (Maestro)

on:
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-runner:
    name: Maestro Flows (Jest In-Memory Interpreter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Maestro Runner in Jest (Monday, Sunday, 23:55 UTC)
        run: npx jest dist/tests/maestro-runner.test.js
