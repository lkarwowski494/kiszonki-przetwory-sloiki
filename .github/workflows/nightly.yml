name: Nightly Property & Stability Tests

on:
  schedule:
    # Codziennie o 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-props:
    name: Fast-Check 1000 Runs & Random Seed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROP_SEED: random
      MATRIX_SEED: random
      MATRIX_RUNS: '1000'
      NODE_OPTIONS: --max-old-space-size=3072
      FORCE_COLOR: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification with random seed & 1000 runs
        run: npm run verify
