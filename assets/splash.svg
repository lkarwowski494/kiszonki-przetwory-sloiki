<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="2688" viewBox="0 0 1242 2688">
  <!-- Ekran startowy (Splash Screen) dla aplikacji Słoik (Jarwise) -->
  <rect width="1242" height="2688" fill="#F7F5F0"/>
  
  <g transform="translate(271, 950)">
    <!-- Cień słoika -->
    <ellipse cx="350" cy="740" rx="260" ry="30" fill="#E2DDD5" opacity="0.8"/>

    <!-- Korpus słoika szklanego Weck / Twist-Off -->
    <rect x="120" y="240" width="460" height="480" rx="60" fill="#FFFFFF" stroke="#3D3A35" stroke-width="24"/>
    
    <!-- Zalewa fermentacyjna / solanka -->
    <path d="M132 380 Q350 400 568 380 L568 660 Q568 708 520 708 L180 708 Q132 708 132 660 Z" fill="#EBF3E8"/>

    <!-- Ogórki i przyprawy wewnątrz -->
    <rect x="180" y="420" width="80" height="230" rx="40" fill="#3D7436" transform="rotate(-6 220 535)"/>
    <rect x="390" y="410" width="85" height="240" rx="42" fill="#2D5A27" transform="rotate(8 432 530)"/>
    <circle cx="310" cy="590" r="32" fill="#F4E8B8" stroke="#D8C47E" stroke-width="6"/>

    <!-- Bąbelki CO2 żywej fermentacji -->
    <circle cx="280" cy="440" r="14" fill="#FFFFFF" stroke="#7BA874" stroke-width="5"/>
    <circle cx="330" cy="360" r="18" fill="#FFFFFF" stroke="#7BA874" stroke-width="6"/>
    <circle cx="480" cy="460" r="12" fill="#FFFFFF" stroke="#7BA874" stroke-width="4"/>

    <!-- Rant szklany szyjki -->
    <rect x="170" y="190" width="360" height="60" rx="20" fill="#F4EFE6" stroke="#3D3A35" stroke-width="24"/>

    <!-- Pokrywka Twist-Off rustykalna terakota -->
    <path d="M140 140 C140 115 160 95 190 95 L510 95 C540 95 560 115 560 140 L570 190 L130 190 Z" fill="#9E472A" stroke="#3D3A35" stroke-width="24"/>
    <line x1="170" y1="140" x2="530" y2="140" stroke="#BA5B39" stroke-width="12" stroke-linecap="round"/>

    <!-- Połysk szkła -->
    <path d="M155 260 L155 680" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Typografia marki -->
  <text x="621" y="1860" font-family="Georgia, serif" font-size="76" font-weight="bold" text-anchor="middle" fill="#1C1A17" letter-spacing="4">SŁOIK</text>
  <text x="621" y="1930" font-family="Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle" fill="#59544D" letter-spacing="2">JARWISE • APPS4BREW</text>
</svg>
