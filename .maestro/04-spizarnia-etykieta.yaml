appId: com.apps4brew.sloik
name: 04 Zarządzanie spiżarnią, podgląd etykiety QR i zużycie słoika
---
- launchApp
- tapOn: "Spiżarnia"
- assertVisible: "Moja Spiżarnia 🫙"
- assertVisible: "Drukuj etykietę QR 🏷️"
