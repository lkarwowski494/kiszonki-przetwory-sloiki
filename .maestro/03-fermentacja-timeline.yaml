appId: com.apps4brew.sloik
name: 03 Oś czasu fermentacji, odgazowanie i przeniesienie w Dojrzewalni
---
- launchApp
- tapOn: "Dojrzewalnia"
- assertVisible: "Aktywne Fermentacje 🫧"
- assertVisible: "Odgazuj słoik (Burp) 💨"
- tapOn: "Odgazuj słoik (Burp) 💨"
- assertVisible: "Słoik odgazowany! 🫧"
- tapOn: "OK"
- takeScreenshot: 03-fermentacja
